[package]
name = "voiceink-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "VoiceInk for Windows: voice-to-text dictation that pastes into any app"
license = "GPL-3.0-only"
repository = "https://github.com/PuppetMaster2k/VoiceInkW"
publish = false

[[bin]]
name = "voiceink"
path = "src/main.rs"

[lib]
name = "voiceink"
path = "src/lib.rs"

[features]
default = []
# Offline transcription with whisper.cpp (needs CMake + a C++ toolchain at build time).
local-whisper = ["dep:whisper-rs"]

[build-dependencies]
embed-resource = "3"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
whisper-rs = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", features = ["json"] }

# Lint policy (see CONTRIBUTING-windows.md). `cargo clippy --all-targets -- -D warnings`
# must pass for both the host and the Windows target.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every `unsafe` block states why it is sound.
undocumented_unsafe_blocks = "warn"
# Panics are for bugs, not for recoverable errors (allowed in tests via clippy.toml).
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
# Pedantic lints that add noise without value for this crate:
module_name_repetitions = "allow" # e.g. `TranscriptionError` in `transcription`
must_use_candidate = "allow"           # applied deliberately on builders/pure fns instead
# Settings structs mirror independent user options; bools are the natural type.
struct_excessive_bools = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
