name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    # Bounds worst-case cost of a hang (e.g. a Carbon/AppKit call that stalls on CI's
    # headless runner) — without this, GitHub's default job timeout is 6 hours.
    # Green runs take ~11-13 min; this leaves headroom without masking a real stall.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake
        run: brew install cmake

      - name: Build (ad-hoc, no Apple Developer account required)
        run: make local

      - name: Run unit tests
        # Scoped to VoiceInkTests only — VoiceInkUITests needs real GUI
        # automation permissions and times out enabling automation mode in
        # any headless/CI environment, this one included.
        # Parallel testing disabled — Swift Testing's default concurrent
        # workers are flaky on GitHub's shared runners (one worker aborted
        # on launch and bulk-failed its whole batch with 0.000s durations,
        # while the other worker's identical tests passed normally).
        run: |
          xcodebuild test \
            -project VoiceInk.xcodeproj \
            -scheme VoiceInk \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:VoiceInkTests \
            -parallel-testing-enabled NO \
            -xcconfig LocalBuild.xcconfig \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/VoiceInk/VoiceInk.local.entitlements" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) LOCAL_BUILD'

  lint:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint (report only — see docs/adr/0008-lint-as-going-forward-guardrail.md)
        run: swiftlint lint --quiet VoiceInk
